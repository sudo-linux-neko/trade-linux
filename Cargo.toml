[package]
name = "trade-bot"
version = "0.1.0"
edition = "2021"
description = "Long-only crypto spot trend bot (EMA+RSI+ATR) with event-driven backtester — $0 budget, Binance free data"
license = "MIT"

[[bin]]
name = "trade-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
